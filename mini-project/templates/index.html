<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carbon Credits Blockchain</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        .actions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .action-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .action-card h3 {
            margin-bottom: 15px;
            color: #667eea;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .retire-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .chain-section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .chain-section h3 {
            margin-bottom: 20px;
            color: #667eea;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .block {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .block-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: bold;
            color: #667eea;
        }

        .transaction {
            background: white;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border-left: 3px solid #28a745;
        }

        .transaction.retired {
            border-left-color: #dc3545;
            opacity: 0.8;
        }

        .transaction.issued {
            border-left-color: #17a2b8;
        }

        .message {
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .refresh-btn {
            background: #28a745;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌿 Carbon Credits Blockchain</h1>
            <p class="subtitle">Track, Issue, Transfer & Retire Carbon Credits</p>
        </header>

        <div class="stats-bar" id="statsBar">
            <div class="stat-card">
                <div class="stat-value" id="totalBlocks">-</div>
                <div class="stat-label">Total Blocks</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalCredits">-</div>
                <div class="stat-label">Credits Issued</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalTransactions">-</div>
                <div class="stat-label">Transactions</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="pendingTransactions">-</div>
                <div class="stat-label">Pending</div>
            </div>
        </div>

        <div class="actions-grid">
            <div class="action-card">
                <h3>Issue Credits</h3>
                <div id="issueMessage" class="message"></div>
                <form id="issueForm">
                    <div class="form-group">
                        <label for="issueRecipient">Recipient</label>
                        <input type="text" id="issueRecipient" name="recipient" placeholder="e.g., green_energy_corp" required>
                    </div>
                    <div class="form-group">
                        <label for="issueCredits">Credits (tonnes CO2e)</label>
                        <input type="number" id="issueCredits" name="credits" placeholder="500" min="0.01" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="issueProjectType">Project Type</label>
                        <select id="issueProjectType" name="project_type">
                            <option value="renewable_energy">Renewable Energy</option>
                            <option value="reforestation">Reforestation</option>
                            <option value="carbon_capture">Carbon Capture</option>
                            <option value="energy_efficiency">Energy Efficiency</option>
                            <option value="waste_management">Waste Management</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="issueDescription">Description (optional)</label>
                        <textarea id="issueDescription" name="description" rows="2" placeholder="Project description"></textarea>
                    </div>
                    <button type="submit" id="issueBtn">Issue Credits</button>
                </form>
            </div>

            <div class="action-card">
                <h3>Transfer Credits</h3>
                <div id="transferMessage" class="message"></div>
                <form id="transferForm">
                    <div class="form-group">
                        <label for="transferSender">Sender</label>
                        <input type="text" id="transferSender" name="sender" placeholder="e.g., green_energy_corp" required>
                    </div>
                    <div class="form-group">
                        <label for="transferRecipient">Recipient</label>
                        <input type="text" id="transferRecipient" name="recipient" placeholder="e.g., eco_retailer" required>
                    </div>
                    <div class="form-group">
                        <label for="transferCredits">Credits (tonnes CO2e)</label>
                        <input type="number" id="transferCredits" name="credits" placeholder="100" min="0.01" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="transferDescription">Description (optional)</label>
                        <textarea id="transferDescription" name="description" rows="2" placeholder="Transaction description"></textarea>
                    </div>
                    <button type="submit" id="transferBtn">Transfer Credits</button>
                </form>
            </div>

            <div class="action-card">
                <h3>Retire Credits</h3>
                <div id="retireMessage" class="message"></div>
                <form id="retireForm">
                    <div class="form-group">
                        <label for="retireOwner">Owner</label>
                        <input type="text" id="retireOwner" name="owner" placeholder="e.g., eco_retailer" required>
                    </div>
                    <div class="form-group">
                        <label for="retireCredits">Credits to Retire (tonnes CO2e)</label>
                        <input type="number" id="retireCredits" name="credits" placeholder="50" min="0.01" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="retireReason">Reason</label>
                        <textarea id="retireReason" name="reason" rows="2" placeholder="e.g., Offset 2024 company emissions"></textarea>
                    </div>
                    <button type="submit" class="retire-btn" id="retireBtn">Retire (Burn) Credits</button>
                </form>
            </div>
        </div>

        <div class="actions-grid">
            <div class="action-card">
                <h3>Blockchain Actions</h3>
                <div id="validateMessage" class="message"></div>
                <button type="button" class="refresh-btn" id="refreshBtn">Refresh Blockchain</button>
                <button type="button" id="validateBtn">Validate Block (Mine)</button>
            </div>
        </div>

        <div class="chain-section" id="pendingSection" style="display: none; margin-bottom: 20px;">
            <h3>Pending Transactions (not yet mined)</h3>
            <div id="pendingDisplay"></div>
        </div>

        <div class="chain-section">
            <h3>Blockchain</h3>
            <div id="chainDisplay"></div>
        </div>
    </div>

    <script>
        const API_URL = (window.location.protocol === 'http:' || window.location.protocol === 'https:')
            ? window.location.origin
            : 'http://127.0.0.1:5001';

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function transactionType(transaction) {
            const description = (transaction.description || '').toLowerCase();
            if (transaction.sender === '0') {
                return 'issued';
            }
            if (description.includes('retired') || transaction.recipient === 'BURN') {
                return 'retired';
            }
            return 'transfer';
        }

        function renderTransaction(transaction) {
            const txDiv = document.createElement('div');
            const txType = transactionType(transaction);
            txDiv.className = `transaction ${txType}`;

            const credits = escapeHtml(transaction.credits);
            const recipient = escapeHtml(transaction.recipient);
            const sender = escapeHtml(transaction.sender);
            const projectType = escapeHtml(transaction.project_type || 'N/A');
            const description = escapeHtml(transaction.description || '');

            if (txType === 'issued') {
                txDiv.innerHTML = `
                    <strong>ISSUED:</strong> ${credits} credits to ${recipient}<br>
                    <small>Project: ${projectType}</small><br>
                    <small>${description}</small>
                `;
            } else if (txType === 'retired') {
                txDiv.innerHTML = `
                    <strong>RETIRED:</strong> ${credits} credits from ${sender}<br>
                    <small>${description}</small>
                `;
            } else {
                txDiv.innerHTML = `
                    <strong>TRANSFER:</strong> ${credits} credits<br>
                    From: ${sender} → To: ${recipient}<br>
                    <small>${description}</small>
                `;
            }
            return txDiv;
        }

        async function loadStats() {
            try {
                const response = await fetch(`${API_URL}/stats`);
                const data = await response.json();

                document.getElementById('totalBlocks').textContent = data.total_blocks || 0;
                document.getElementById('totalCredits').textContent = data.total_credits_issued || 0;
                document.getElementById('totalTransactions').textContent = data.total_transactions || 0;
                document.getElementById('pendingTransactions').textContent = data.pending_transactions || 0;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        function renderPending(pending) {
            const pendingSection = document.getElementById('pendingSection');
            const pendingDisplay = document.getElementById('pendingDisplay');
            pendingDisplay.innerHTML = '';

            if (!pending || pending.length === 0) {
                pendingSection.style.display = 'none';
                return;
            }

            pendingSection.style.display = 'block';
            pending.forEach((transaction) => {
                pendingDisplay.appendChild(renderTransaction(transaction));
            });
        }

        async function loadChain() {
            try {
                const response = await fetch(`${API_URL}/chain`);
                const data = await response.json();
                renderPending(data.pending_transactions || []);

                const chainDisplay = document.getElementById('chainDisplay');
                chainDisplay.innerHTML = '';

                (data.chain || []).forEach((block) => {
                    const blockDiv = document.createElement('div');
                    blockDiv.className = 'block';

                    const blockHeader = document.createElement('div');
                    blockHeader.className = 'block-header';
                    blockHeader.innerHTML = `
                        <span>Block #${escapeHtml(block.index)}</span>
                        <span>Proof: ${escapeHtml(block.proof)}</span>
                    `;
                    blockDiv.appendChild(blockHeader);

                    const transactionsDiv = document.createElement('div');
                    const transactions = block.transactions || [];
                    transactions.forEach((transaction) => {
                        transactionsDiv.appendChild(renderTransaction(transaction));
                    });

                    if (transactions.length === 0) {
                        const emptyTx = document.createElement('div');
                        emptyTx.className = 'transaction';
                        emptyTx.textContent = 'Genesis Block';
                        transactionsDiv.appendChild(emptyTx);
                    }

                    blockDiv.appendChild(transactionsDiv);

                    const hashDiv = document.createElement('div');
                    hashDiv.style.marginTop = '10px';
                    hashDiv.style.fontSize = '12px';
                    hashDiv.style.color = '#666';
                    hashDiv.textContent = `Hash: ${block.previous_hash || 'N/A'}`;
                    blockDiv.appendChild(hashDiv);

                    chainDisplay.appendChild(blockDiv);
                });
            } catch (error) {
                console.error('Error loading chain:', error);
            }
        }

        async function postJson(path, body) {
            const response = await fetch(`${API_URL}${path}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            let data = {};
            try {
                data = await response.json();
            } catch (error) {
                data = { error: 'Server returned a non-JSON response' };
            }
            return { response, data };
        }

        async function issueCredits() {
            const recipient = document.getElementById('issueRecipient').value.trim();
            const credits = parseFloat(document.getElementById('issueCredits').value);
            const projectType = document.getElementById('issueProjectType').value;
            const description = document.getElementById('issueDescription').value.trim();

            if (!recipient || !credits || credits <= 0) {
                showMessage('issueMessage', 'Please fill all required fields', 'error');
                return;
            }

            const button = document.getElementById('issueBtn');
            button.disabled = true;
            try {
                const { response, data } = await postJson('/issue', {
                    recipient,
                    credits,
                    project_type: projectType,
                    description
                });
                if (response.ok) {
                    showMessage('issueMessage', data.message, 'success');
                    document.getElementById('issueForm').reset();
                    await Promise.all([loadStats(), loadChain()]);
                } else {
                    showMessage('issueMessage', data.error || 'Error issuing credits', 'error');
                }
            } catch (error) {
                showMessage('issueMessage', 'Error connecting to server', 'error');
            } finally {
                button.disabled = false;
            }
        }

        async function transferCredits() {
            const sender = document.getElementById('transferSender').value.trim();
            const recipient = document.getElementById('transferRecipient').value.trim();
            const credits = parseFloat(document.getElementById('transferCredits').value);
            const description = document.getElementById('transferDescription').value.trim();

            if (!sender || !recipient || !credits || credits <= 0) {
                showMessage('transferMessage', 'Please fill all required fields', 'error');
                return;
            }

            const button = document.getElementById('transferBtn');
            button.disabled = true;
            try {
                const { response, data } = await postJson('/transfer', {
                    sender,
                    recipient,
                    credits,
                    description
                });
                if (response.ok) {
                    showMessage('transferMessage', data.message, 'success');
                    document.getElementById('transferForm').reset();
                    await Promise.all([loadStats(), loadChain()]);
                } else {
                    showMessage('transferMessage', data.error || 'Error transferring credits', 'error');
                }
            } catch (error) {
                showMessage('transferMessage', 'Error connecting to server', 'error');
            } finally {
                button.disabled = false;
            }
        }

        async function retireCredits() {
            const owner = document.getElementById('retireOwner').value.trim();
            const credits = parseFloat(document.getElementById('retireCredits').value);
            const reason = document.getElementById('retireReason').value.trim();

            if (!owner || !credits || credits <= 0) {
                showMessage('retireMessage', 'Please fill all required fields', 'error');
                return;
            }

            const button = document.getElementById('retireBtn');
            button.disabled = true;
            try {
                const { response, data } = await postJson('/retire', {
                    owner,
                    credits,
                    reason
                });
                if (response.ok) {
                    showMessage('retireMessage', data.message, 'success');
                    document.getElementById('retireForm').reset();
                    await Promise.all([loadStats(), loadChain()]);
                } else {
                    showMessage('retireMessage', data.error || 'Error retiring credits', 'error');
                }
            } catch (error) {
                showMessage('retireMessage', 'Error connecting to server', 'error');
            } finally {
                button.disabled = false;
            }
        }

        async function validateBlock() {
            const button = document.getElementById('validateBtn');
            button.disabled = true;
            button.textContent = 'Mining...';
            try {
                const { response, data } = await postJson('/validate', {});
                if (response.ok) {
                    showMessage(
                        'validateMessage',
                        `Block validated. Proof: ${data.proof}. Transactions: ${(data.transactions || []).length}`,
                        'success'
                    );
                    await Promise.all([loadStats(), loadChain()]);
                } else {
                    showMessage('validateMessage', data.error || 'Error validating block', 'error');
                }
            } catch (error) {
                showMessage('validateMessage', 'Error connecting to server', 'error');
            } finally {
                button.disabled = false;
                button.textContent = 'Validate Block (Mine)';
            }
        }

        function showMessage(elementId, message, type) {
            const msgElement = document.getElementById(elementId);
            if (!msgElement) {
                return;
            }
            msgElement.textContent = message;
            msgElement.className = `message ${type}`;
            setTimeout(() => {
                msgElement.className = 'message';
                msgElement.textContent = '';
            }, 5000);
        }

        document.getElementById('issueForm').addEventListener('submit', (event) => {
            event.preventDefault();
            issueCredits();
        });
        document.getElementById('transferForm').addEventListener('submit', (event) => {
            event.preventDefault();
            transferCredits();
        });
        document.getElementById('retireForm').addEventListener('submit', (event) => {
            event.preventDefault();
            retireCredits();
        });
        document.getElementById('refreshBtn').addEventListener('click', () => {
            loadStats();
            loadChain();
        });
        document.getElementById('validateBtn').addEventListener('click', () => {
            validateBlock();
        });

        loadStats();
        loadChain();
        setInterval(() => {
            loadStats();
            loadChain();
        }, 10000);
    </script>
</body>
</html>
